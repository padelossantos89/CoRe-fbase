<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILECO III · Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --ink:#1B1B1B; --paper:#F6F4EE; --yellow:#FBC94C; --yellow-deep:#E8A423;
    --navy:#122236; --navy-2:#193150; --cream:#FFFDF5; --line:rgba(0,0,0,.10);
    --red:#B7473D; --red-tint:#F6DEDB; --green:#4C7A5E; --green-tint:#DCEBE1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(165deg, var(--yellow) 0%, var(--yellow-deep) 100%);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header.top{ display:flex; align-items:center; gap:12px; justify-content:space-between; padding:14px 40px; background:var(--navy); }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand span{font-weight:600; font-size:14.5px; color:#fff;}
  main{ flex:1 0 auto; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card{
    width:100%; max-width:420px; background:var(--cream); border:1px solid var(--line); border-radius:16px;
    padding:34px 32px 28px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 24px 60px rgba(0,0,0,.16);
    opacity:0; transform:translateY(18px); animation:cardIn .5s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .card h1{ font-family:'Space Grotesk',system-ui,sans-serif; font-size:21px; margin:0 0 4px; }
  .card p.sub{ margin:0 0 22px; font-size:13.5px; color:#5C5C5C; }
  label{display:block; font-size:12px; font-weight:600; color:#5C5C5C; margin-bottom:5px;}
  .field{margin-bottom:15px;}
  input[type="password"]{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fff; color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--yellow-deep); box-shadow:0 0 0 3px rgba(232,164,35,.18); }
  .btn{ width:100%; margin-top:6px; cursor:pointer; border:none; border-radius:8px; padding:12px 18px; font-weight:700; font-size:14.5px; background:var(--navy); color:#fff; }
  .btn:hover{ background:var(--navy-2); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .msg-box{ display:none; margin-bottom:16px; padding:9px 12px; border-radius:8px; font-size:13px; font-weight:600; }
  .msg-box.error{ background:var(--red-tint); border:1px solid var(--red); color:var(--red); }
  .msg-box.ok{ background:var(--green-tint); border:1px solid var(--green); color:var(--green); }
  .hint{ font-size:11.5px; color:#8B96A0; margin:-8px 0 15px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span>Iloilo III Electric Cooperative, Inc.</span></div>
</header>
<main>
  <form class="card" id="cp-form" autocomplete="off">
    <h1>Set a new password</h1>
    <p class="sub">This is your first time logging in — choose a new password before continuing.</p>
    <div class="msg-box" id="cp-msg"></div>
    <div class="field">
      <label for="oldPassword">Current (temporary) password</label>
      <input type="password" id="oldPassword" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required autocomplete="new-password" minlength="8">
    </div>
    <div class="hint">At least 8 characters.</div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
    </div>
    <button type="submit" class="btn" id="cp-btn">Save new password</button>
  </form>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBJOfUc76neQC6e9KkiVkSxGvXLmo5J74Q",
  authDomain: "ileco-iii-core.firebaseapp.com",
  projectId: "ileco-iii-core",
  storageBucket: "ileco-iii-core.firebasestorage.app",
  messagingSenderId: "319768694684",
  appId: "1:319768694684:web:ba0f169facd757af44c259"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const fdb = firebase.firestore();
function usernameToEmail_(username){ return username.trim().toLowerCase() + '@ileco3.local'; }

const session = JSON.parse(localStorage.getItem('ileco3_session') || 'null');
if(!session){ location.href = 'login.html'; }

// After a full page load, Firebase needs a moment to restore the signed-in
// user from the last page — wait for that before trying to use it.
function waitForAuthUser_(){
  return new Promise(resolve => {
    if(auth.currentUser){ resolve(auth.currentUser); return; }
    const unsub = auth.onAuthStateChanged(u => { unsub(); resolve(u); });
  });
}

async function changePassword(username, oldPassword, newPassword){
  try{
    const user = await waitForAuthUser_();
    if(!user) return { ok:false, error:'Your session expired — please log out and in again.' };
    const email = usernameToEmail_(username);
    // Firebase requires a recent login to change a password — re-authenticate
    // with the current password first (this also verifies it's correct).
    const cred = firebase.auth.EmailAuthProvider.credential(email, oldPassword);
    const result = await user.reauthenticateWithCredential(cred);
    await user.updatePassword(newPassword);
    const doc = await fdb.collection('users').doc(result.user.uid).get();
    const role = doc.exists ? doc.data().role : session.role;
    await fdb.collection('users').doc(result.user.uid).update({ mustChangePassword:false });
    await fdb.collection('activityLog').add({ username, role, action:'Changed password', details:'', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    return { ok:true };
  }catch(err){
    const msg = err.code === 'auth/wrong-password' ? 'Current password is incorrect.'
              : err.code === 'auth/weak-password' ? 'New password must be at least 8 characters.'
              : err.message;
    return { ok:false, error: msg };
  }
}

const form = document.getElementById('cp-form');
const msg = document.getElementById('cp-msg');
const btn = document.getElementById('cp-btn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  msg.style.display = 'none';
  const oldPassword = document.getElementById('oldPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if(newPassword.length < 8){
    msg.className = 'msg-box error'; msg.textContent = 'New password must be at least 8 characters.'; msg.style.display=''; return;
  }
  if(newPassword !== confirmPassword){
    msg.className = 'msg-box error'; msg.textContent = 'New password and confirmation do not match.'; msg.style.display=''; return;
  }

  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const result = await changePassword(session.username, oldPassword, newPassword);
    if(!result.ok){
      msg.className = 'msg-box error'; msg.textContent = result.error || 'Could not change password.'; msg.style.display='';
      btn.disabled = false; btn.textContent = 'Save new password';
      return;
    }
    msg.className = 'msg-box ok'; msg.textContent = 'Password updated — redirecting…'; msg.style.display='';
    setTimeout(()=>{
      location.href = session.role === 'admin' ? 'admin.html' : (session.role === 'field' ? 'field.html' : 'index.html');
    }, 900);
  }catch(err){
    msg.className = 'msg-box error'; msg.textContent = 'Could not reach the login service: ' + err.message; msg.style.display='';
    btn.disabled = false; btn.textContent = 'Save new password';
  }
});
</script>
</body>
</html>
