<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILECO III · Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="change-password.css">
</head>
<body>
<header class="top">
  <div class="brand"><span>Iloilo III Electric Cooperative, Inc.</span></div>
</header>
<main>
  <form class="card" id="cp-form" autocomplete="off">
    <h1>Set a new password</h1>
    <p class="sub">This is your first time logging in — choose a new password before continuing.</p>
    <div class="msg-box" id="cp-msg"></div>
    <div class="field">
      <label for="oldPassword">Current (temporary) password</label>
      <input type="password" id="oldPassword" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required autocomplete="new-password" minlength="8">
    </div>
    <div class="hint">At least 8 characters.</div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
    </div>
    <button type="submit" class="btn" id="cp-btn">Save new password</button>
  </form>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="change-password.js"></script>
</body>
</html>
